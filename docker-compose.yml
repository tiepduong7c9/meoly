services:
  meoly:
    image: ghcr.io/tiepduong7c9/meoly:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      NODE_ENV: production
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      TOTP_SECRET: ${TOTP_SECRET:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
