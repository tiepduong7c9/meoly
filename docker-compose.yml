services:
  meoly:
    image: ghcr.io/tiepduong7c9/meoly:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      NODE_ENV: production
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      TOTP_SECRET: ${TOTP_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DRY_RUN: ${AI_DRY_RUN:-false}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_BODY_CHARS: ${AI_MAX_BODY_CHARS:-}
      AI_POLL_INTERVAL_MS: ${AI_POLL_INTERVAL_MS:-}
      AI_TARGET_FOLDERS: ${AI_TARGET_FOLDERS:-}
      AI_AUTO_APPLY: ${AI_AUTO_APPLY:-}
      AI_AUTO_APPLY_MIN_CONFIDENCE: ${AI_AUTO_APPLY_MIN_CONFIDENCE:-}
      AI_AUTO_APPLY_ACTIONS: ${AI_AUTO_APPLY_ACTIONS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Microsoft OAuth for Outlook / Office 365 (optional). REDIRECT_URI must
      # exactly match the Azure app registration, e.g.
      # https://your-domain/api/oauth/microsoft/callback. Leave it blank to
      # derive it from the request (needs the proxy to send X-Forwarded-Proto
      # and X-Forwarded-Host).
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_TENANT: ${MS_OAUTH_TENANT:-common}
      MS_OAUTH_REDIRECT_URI: ${MS_OAUTH_REDIRECT_URI:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
